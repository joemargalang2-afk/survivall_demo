<script>
  // A missing page can be at any depth, so point the button at the folder that holds the game.
  var parts = location.pathname.split('/').filter(Boolean);
  var home = /\.github\.io$/.test(location.hostname) && parts.length ? '/' + parts[0] + '/' : '/';
  document.getElementById('home').href = home;
</script>
