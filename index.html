xed;top:0;bottom:0;left:0;right:0}#boot-loading.show{display:flex}#boot-loading .note{color:#ece3c8;max-width:80vw;font:14px Pixelify Sans,monospace}#load-error{z-index:30;background:#10141cd9;justify-content:center;align-items:center;padding:16px;display:none;position:fixed;top:0;bottom:0;left:0;right:0}#load-error.show{display:flex}#load-error .box{text-align:center;background:#000;border:4px solid #fff;max-width:480px;padding:20px 24px;box-shadow:0 0 0 4px #000}#load-error .title{color:#f28c28;margin-bottom:12px;font:16px Silkscreen,monospace}#load-error .body{color:#fff;font:16px/1.4 Pixelify Sans,monospace}#load-error .code{color:#a8a4a4;margin:12px 0 16px;font:12px Silkscreen,monospace}#load-error .retry{cursor:pointer;width:187px;height:55px;image-rendering:pixelated;color:#2a1608;background:#e1b947 url(assets/ui/buttons.png) no-repeat;border:0;font:700 20px Silkscreen,monospace}#diag{z-index:40;color:#ece3c8;font:11px monospace;position:fixed;top:6px;left:6px}#diag button{color:#2a1608;cursor:pointer;background:#e1b947;border:2px solid #1d1b17;padding:4px 8px;font:12px Silkscreen,monospace}#diag .body{background:#000000eb;border:2px solid #a4977d;width:min(92vw,640px);margin-top:6px;padding:8px}#diag pre{white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;-moz-user-select:text;user-select:text;max-height:60vh;margin:0 0 8px;overflow:auto}#diag .row{gap:8px;display:flex}</style>

<body>
    <div id="game-container"></div>
    <div id="rotate-screen" role="alert">
        <img src="assets/ui/rotate_phone.png" alt="">
        <div class="title">PLEASE ROTATE YOUR PHONE</div>
        <div class="sub">SurvivALL plays sideways. Turn your phone to landscape to continue.</div>
    </div>
    <div id="install-hint" role="dialog" aria-label="Install SurvivALL">
        <b>TIP</b><br>Add SurvivALL to your Home screen for the best fullscreen experience.
        <div><button class="go" type="button" hidden>INSTALL</button></div>
        <button class="close" type="button" aria-label="Close">X</button>
    </div>
    <div id="boot-loading" class="show"><div>LOADING...</div><div class="note"></div></div>
    <div id="load-error" role="alert">
        <div class="box">
            <div class="title">SOMETHING WENT WRONG</div>
            <div class="body"></div>
            <div class="code"></div>
            <button class="retry" type="button">TRY AGAIN</button>
        </div>
    </div>
    <script>
        // Plain old JavaScript on purpose (runs in any browser). Until the game's code has started: after 20 s say
        // that a slow connection is fine; after 120 s, or if the code fails to load, show the message (L-01).
        (function () {
            var boot = window.__survivallBoot = { t0: Date.now(), started: false, booted: false };
            function show(code, title, body) {
                if (boot.booted) return;
                var box = document.getElementById('load-error');
                if (!box || box.className.indexOf('show') >= 0) return;
                box.querySelector('.title').textContent = title;
                box.querySelector('.body').textContent = body;
                box.querySelector('.code').textContent = 'Error ' + code;
                box.className += ' show';
                box.querySelector('.retry').onclick = function () { window.location.reload(); };
            }
            window.__survivallBootFail = show;
            window.addEventListener('error', function (e) {
                // before the game's own handlers are in place: its code failed to download, or this browser cannot run it
                if (boot.started || !e) return;
                var isScript = e.target && e.target.tagName === 'SCRIPT';
                if (!isScript && (!e.message || /^Script error/.test(e.message))) return; // browser extensions etc.
                show('L-01', 'SOMETHING WENT WRONG', 'The game could not finish loading. Check your internet, then tap Try again.');
            }, true);
            setTimeout(function () {
                if (boot.booted) return;
                var note = document.querySelector('#boot-loading .note');
                if (note) note.textContent = 'Slow connection? Keep this page open. The game is still downloading.';
            }, 20000);
            setTimeout(function () {
                show('L-01', 'SOMETHING WENT WRONG', 'The game could not start. Tap Try again. If it still does not work, close this page and open it again, or try Chrome (or Safari on iPhone).');
            }, 120000);
        })();
    </script>
    <script nomodule>
        window.__survivallBootFail('L-07', 'PLEASE UPDATE YOUR BROWSER', 'This browser is too old to run the game. Please open it in Chrome (or Safari on iPhone).');
    </script>
</body>
